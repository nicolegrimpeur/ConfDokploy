volumes:
  prometheus_data:
    external: true
    name: prometheus_data
  grafana_data:
    external: true
    name: grafana_data
  loki_data:
    external: true
    name: loki_data

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    ports:
      - "3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-change-me}
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED}
      - GF_SMTP_HOST=${GF_SMTP_HOST}
      - GF_SMTP_USER=${GF_SMTP_USER}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME}
      - GF_SMTP_SKIP_VERIFY=${GF_SMTP_SKIP_VERIFY}
      - GF_SMTP_STARTTLS_POLICY=${GF_SMTP_STARTTLS_POLICY}
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - /run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - '/:/host:ro,rslave'
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.systemd"
      - "--collector.processes"

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    ports:
      - "8080"
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    depends_on:
      prometheus:
        condition: service_healthy

  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  snmp-exporter:
    image: prom/snmp-exporter:v0.31.0
    container_name: snmp-exporter
    ports:
      - "9116"
    environment:
      - SNMP_USER=${SNMP_USER}
      - SNMP_AUTH_PASS=${SNMP_AUTH_PASS}
      - SNMP_PRIV_PASS=${SNMP_PRIV_PASS}
    volumes:
      - ./snmp/auth.yml:/etc/snmp_exporter/auth.yml:ro
      - ./snmp/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    command:
      - "--config.expand-environment-variables"
      - "--config.file=/etc/snmp_exporter/auth.yml"
      - "--config.file=/etc/snmp_exporter/snmp.yml"
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
